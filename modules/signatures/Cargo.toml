[package]
name = "kryptocore-signatures"
version = "0.1.0-preview.1"
edition = "2021"
license = "MIT"
description = "Optional purpose-bound Ed25519 signatures for KryptoCore applications"
publish = false

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
zeroize = "1"

[dev-dependencies]
hex-literal = "0.4"
curve25519-dalek = { version = "4.1.3", default-features = false }
