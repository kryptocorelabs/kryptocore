[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kryptocore"
version = "0.1.0.dev0"
description = "Local encryption primitives for KryptoCore applications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["argon2-cffi>=23.1.0", "PyNaCl>=1.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
