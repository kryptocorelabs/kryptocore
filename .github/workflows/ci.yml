name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked --release

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.9', '3.14']
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          # setup-python has no CPython 3.9 build for Ubuntu 26.04.
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --release -p kryptocore --test interop -- --ignored

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install --locked cargo-audit
      - run: cargo +stable audit --deny warnings
      - run: cargo +stable audit --file fuzz/Cargo.lock --deny warnings

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz
      - run: cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - run: cargo +nightly fuzz run aead -- -max_total_time=45 -max_len=4096
      - run: git diff --exit-code -- fuzz/Cargo.lock

  source-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash scripts/source-archive.sh
      - uses: actions/upload-artifact@v6
        with:
          name: core-source-${{ github.sha }}
          path: dist/source/
          if-no-files-found: error
