name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked --release --all-features
      - name: Check Argon2id under parallel load and a process memory limit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo +stable test --locked --release --test argon2_memory -- --ignored --exact argon2id_derives_keys_concurrently
          test_binary=$(cargo +stable test --locked --release --test argon2_memory --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.name == "argon2_memory") | .executable // empty')
          (ulimit -v 196608 && "$test_binary" --ignored --exact argon2id_reports_reservation_failure)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ['3.9', '3.14']
        exclude:
          - os: ubuntu-latest
            python: '3.9'
          # CPython 3.9 x64 requires Intel Homebrew libraries absent on arm64.
          # Minimum-version compatibility remains covered on Linux and Windows.
          - os: macos-15
            python: '3.9'
        include:
          # setup-python has no CPython 3.9 build for Ubuntu 26.04.
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --release -p kryptocore --test interop -- --ignored
      - name: Cross-check optional signatures with PyNaCl
        run: cargo +stable test --locked --release -p kryptocore-signatures --test interop -- --ignored

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install --locked cargo-audit
      - run: cargo +stable audit --deny warnings
      - run: cargo +stable audit --file fuzz/Cargo.lock --deny warnings

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz
      - run: cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Fuzz authenticated encryption and raw nonce validation
        run: |
          corpus="$RUNNER_TEMP/aead-corpus"
          mkdir "$corpus"
          python3 -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(b"\x00\x80\x17\x00" + bytes(range(256)) * 128)' "$corpus/large-aad"
          cargo +nightly fuzz run aead "$corpus" -- -max_total_time=45 -max_len=65536 -rss_limit_mb=1024
      - name: Fuzz authenticated stream framing
        run: |
          corpus="$RUNNER_TEMP/stream-corpus"
          mkdir "$corpus"
          python3 -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(b"\x1b\x00\x01\x00" + bytes(range(256)) * 256)' "$corpus/full-record"
          cargo +nightly fuzz run stream "$corpus" -- -max_total_time=30 -max_len=131076 -rss_limit_mb=1024
      - run: git diff --exit-code -- fuzz/Cargo.lock

  source-artifact:
    name: Core artifacts (${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: [first, second]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: core-${{ matrix.build }}
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: bash scripts/build-core.sh
        working-directory: core-${{ matrix.build }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-build-${{ matrix.build }}
          path: core-${{ matrix.build }}/dist/source/
          if-no-files-found: error

  compare-artifacts:
    needs: source-artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: core-build-*
          path: builds
      - name: Compare the source archive and Rust library
        run: |
          (cd builds/core-build-first && sha256sum --check SHA256SUMS.txt)
          (cd builds/core-build-second && sha256sum --check SHA256SUMS.txt)
          cmp builds/core-build-{first,second}/SHA256SUMS.txt
          cmp builds/core-build-{first,second}/kryptocore-"$GITHUB_SHA".tar.gz
          cmp builds/core-build-{first,second}/libkryptocore.rlib
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-verified-${{ github.sha }}
          path: builds/core-build-first/
          if-no-files-found: error

  attest-core:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [compare-artifacts, rust, test, audit, fuzz]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: core-verified-${{ github.sha }}
          path: verified
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            verified/kryptocore-${{ github.sha }}.tar.gz
            verified/libkryptocore.rlib
