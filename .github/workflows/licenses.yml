name: Rust dependency licenses

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.19.9
        env:
          CARGO_DENY_SHA256: f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          directory="$RUNNER_TEMP/cargo-deny"
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check
          mkdir "$directory"
          tar -xzf "$archive" -C "$directory" --strip-components=1
          echo "$directory" >> "$GITHUB_PATH"
      - name: Check workspace dependency licenses
        run: cargo deny --locked check --config deny.toml licenses
      - name: Check fuzz dependency licenses
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check --config deny.toml licenses
