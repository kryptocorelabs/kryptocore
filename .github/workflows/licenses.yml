name: Rust dependency licenses

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 install --locked cargo-deny --version 0.19.9
      - name: Check workspace dependency licenses
        run: cargo +1.99.1 deny --locked check --config deny.toml licenses
      - name: Check fuzz dependency licenses
        run: cargo +1.99.1 deny --locked --manifest-path fuzz/Cargo.toml check --config deny.toml licenses
