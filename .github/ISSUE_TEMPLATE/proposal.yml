name: Proposal
description: Suggest a change to the KryptoCore library or its documentation.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Describe what would help. Note any API, interoperability, or security impact if known.
    validations:
      required: true
