[package]
name = "kryptocore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local authenticated encryption and password-based key derivation"
publish = false

[lib]
path = "rust/lib.rs"

[features]
stream = ["chacha20poly1305/stream"]

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
subtle = { version = "2.6", default-features = false }
zeroize = "1"

[dev-dependencies]
hex-literal = "0.4"

[workspace]
members = ["modules/signatures"]
resolver = "2"
